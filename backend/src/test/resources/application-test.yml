spring:
  datasource:
    url: jdbc:h2:mem:codesync_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

cors:
  allowed-origins: http://localhost:5173

jwt:
  secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-testing!
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 7200000

logging:
  level:
    root: INFO
    com.codesync: DEBUG
