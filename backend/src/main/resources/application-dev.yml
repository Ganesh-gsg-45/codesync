spring:
  datasource:
    url: jdbc:h2:file:./data/codesync;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000

jwt:
  secret: dev-only-secret-key-for-local-testing-and-debugging-at-least-256-bits-long!
  access-token-expiration-ms: 86400000
  refresh-token-expiration-ms: 604800000

logging:
  level:
    com.codesync: DEBUG
