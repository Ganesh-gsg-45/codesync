services:
  # 1. Spring Boot Backend on Render
  - type: web
    name: codesync-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true

  # 2. React Frontend on Render (Static Site)
  - type: web
    name: codesync-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://codesync-backend-tk8m.onrender.com/api
      - key: VITE_WS_URL
        value: https://codesync-backend-tk8m.onrender.com/ws
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
